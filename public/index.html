<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Oikoumene: an interactive historical atlas of the Old World, 500 BCE to 2000 CE.">
<title>Oikoumene</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Serif+SC:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
/* Layout: one compact header on a wide screen (wordmark, search, layer chips, tools). From 760–1199px the chips drop to their own band. Below 760px the top bar is a single phone row and layers, language, themes and tour live in a drawer. Map fills the middle; chronicle is a column on wide screens and a sheet on narrow ones. Timeline sits at the bottom. Phase card floats bottom-left; detail card floats top-right, and both become sheets on a phone. */
:root{
  --paper:#eee6d2; --paper-deep:#d8caa6; --sea:#cfdcd6; --sea-line:#a9bdb4; --water:#5f8fa8; --ink:#2a241f; --ink-soft:#6b5f52; --relief:#6f5a3a;
  --rule:#b3a487; --accent:#9a3a22; --panel:rgba(246,241,229,.95); --panel-solid:#f6f1e5; --shadow:0 2px 14px rgba(40,30,10,.16);
  --k-pol:#9a3a22; --k-sci:#1f5f8b; --k-tec:#b8720f; --k-tho:#5b3d8a; --k-rel:#2f7a4f; --k-art:#b5457a;
  --display:"Cormorant Garamond","Noto Serif SC",Georgia,serif; --zh:"Noto Serif SC","Cormorant Garamond",serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --relief-blend:multiply; --relief-op:.85;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#2e2925; --paper-deep:#1f1b18; --sea:#161e21; --sea-line:#2b383c; --water:#4f8cab; --ink:#eadfc8; --ink-soft:#b3a58d; --relief:#c9b48a; --rule:#5a5043; --accent:#e07a5f; --panel:rgba(30,27,24,.95); --panel-solid:#1e1b18; --shadow:0 2px 14px rgba(0,0,0,.5);
  --k-pol:#e07a5f; --k-sci:#6fb3e0; --k-tec:#e6a94a; --k-tho:#b48ee6; --k-rel:#6fcf97; --k-art:#e88ab8; --relief-blend:soft-light; --relief-op:.9; color-scheme:dark } }
:root[data-theme="dark"]{ --paper:#2e2925; --paper-deep:#1f1b18; --sea:#161e21; --sea-line:#2b383c; --water:#4f8cab; --ink:#eadfc8; --ink-soft:#b3a58d; --relief:#c9b48a; --rule:#5a5043; --accent:#e07a5f; --panel:rgba(30,27,24,.95); --panel-solid:#1e1b18; --shadow:0 2px 14px rgba(0,0,0,.5);
  --k-pol:#e07a5f; --k-sci:#6fb3e0; --k-tec:#e6a94a; --k-tho:#b48ee6; --k-rel:#6fcf97; --k-art:#e88ab8; --relief-blend:soft-light; --relief-op:.9; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%;height:100dvh}
body{margin:0;background:var(--sea);color:var(--ink);font-family:var(--display);font-size:15px;overflow:hidden;overscroll-behavior:none}
#app{position:relative;height:100%;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr 330px;grid-template-areas:"hd hd" "map side" "tl tl";overflow:hidden}
header{grid-area:hd;position:relative;display:grid;grid-template-columns:auto minmax(150px,240px) minmax(0,1fr) auto auto;grid-template-areas:"brand search . tools side" "kinds kinds kinds kinds kinds";align-items:center;column-gap:10px;row-gap:3px;padding:4px max(14px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px));padding-top:max(4px,env(safe-area-inset-top,0px));border-bottom:1px solid var(--rule);background:var(--panel-solid);z-index:6;min-width:0}
.brand{grid-area:brand;display:flex;flex-direction:row;align-items:baseline;gap:8px;min-width:0;max-width:22rem;line-height:1}
header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.02em;white-space:nowrap;color:var(--accent);line-height:1}
#sub{display:block;margin:0;font-family:var(--zh);font-size:13px;font-weight:500;color:var(--ink-soft);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--ink-soft);flex-wrap:nowrap;min-width:0}
button,select,input{font:inherit;font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--panel-solid);border:1px solid var(--rule);border-radius:4px;padding:4px 10px;min-height:32px}
button{cursor:pointer;touch-action:manipulation}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"],#b-menu[aria-expanded="true"],#b-side[aria-expanded="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#lang{padding-right:22px}
#drawer{display:contents}
#b-menu{display:none;align-items:center;justify-content:center;width:32px;padding:0;flex:none}
#b-menu svg,#b-side svg{display:block}
#kinds{grid-area:kinds;flex:none;flex-wrap:nowrap;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:thin}
#tools{grid-area:tools;flex:none}
#tools button,#tools select{flex:none;white-space:nowrap}
#search{grid-area:search;min-width:0}
#b-side{grid-area:side}
.chip{display:inline-flex;align-items:center;gap:5px;border-color:var(--c);color:var(--c);background:transparent;flex:none;white-space:nowrap;min-height:30px;padding:2px 8px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 2px var(--panel-solid),0 0 0 3px var(--c)}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.chip[aria-pressed="true"] i{background:#fff;box-shadow:none}
.chip[aria-pressed="false"]{opacity:.55;border-style:dashed;text-decoration:line-through;text-decoration-thickness:1px}
.chip[aria-pressed="false"] i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
#search{position:relative}
.sep{width:1px;height:20px;background:var(--rule);margin:0 4px}
#themes{position:relative}
#b-themes::after{content:' ▾';font-size:10px}
#thmenu{position:absolute;right:0;top:calc(100% + 4px);width:min(300px,calc(100vw - 24px));background:var(--panel-solid);border:1px solid var(--rule);box-shadow:var(--shadow);z-index:9;padding:6px;max-height:min(70vh,420px);overflow:auto}
.th{display:block;padding:8px 10px;border-radius:3px;cursor:pointer;font-family:var(--zh);font-size:13px;color:var(--ink);text-decoration:none}
.th b{display:block;font-weight:600}
.th small{display:block;color:var(--ink-soft);font-family:var(--mono);font-size:10.5px;margin-top:2px}
.th:hover{background:var(--paper-deep)}
.th[aria-pressed="true"]{background:var(--accent);color:#fff}
.th[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.th.more{border-top:1px solid var(--rule);margin-top:4px;color:var(--accent);font-family:var(--mono);font-size:11.5px}
#q{width:100%;padding-left:28px;background:var(--panel-solid) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='7' cy='7' r='4.5' fill='none' stroke='%237a6a55' stroke-width='1.4'/><path d='M10.5 10.5 14 14' stroke='%237a6a55' stroke-width='1.6' stroke-linecap='round'/></svg>") 8px center/14px no-repeat}
#sug{position:absolute;left:0;top:calc(100% + 4px);width:min(320px,calc(100vw - 24px));max-height:min(50vh,300px);overflow:auto;background:var(--panel-solid);border:1px solid var(--rule);box-shadow:var(--shadow);z-index:9;font-family:var(--zh);font-size:13px}
#sug div{padding:6px 10px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
#sug div:hover,#sug div.on{background:var(--paper-deep)}
#sug small{font-family:var(--mono);color:var(--ink-soft);font-size:10.5px;margin-left:auto}
#stage{grid-area:map;min-height:0;min-width:0;position:relative;background:var(--sea);overflow:hidden}
svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;overflow:hidden}
svg.drag{cursor:grabbing}
.land{fill:var(--paper);stroke:none}
.coast{fill:none;stroke:var(--sea-line);stroke-width:.7;vector-effect:non-scaling-stroke}
#relief{mix-blend-mode:var(--relief-blend);opacity:var(--relief-op);pointer-events:none}
.grat{fill:none;stroke:var(--ink);stroke-opacity:.08;stroke-width:.5;vector-effect:non-scaling-stroke}
.frame{fill:none;stroke:var(--ink);stroke-opacity:.3;stroke-width:.8;vector-effect:non-scaling-stroke}
.pol{stroke-width:1.1;stroke-opacity:.85;stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:fill-opacity .25s,stroke-opacity .25s}
.pol.dim{fill-opacity:.06;stroke-opacity:.25}
.pol.un{fill:var(--paper-deep);fill-opacity:.3;stroke:var(--ink);stroke-opacity:.3;stroke-dasharray:2 2;stroke-width:.6}
.layer{transition:opacity .7s ease}
.layer.in{opacity:0}
.ghost{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:3 2.2;opacity:.6;vector-effect:non-scaling-stroke;pointer-events:none}
.lake{fill:var(--sea);stroke:var(--sea-line);stroke-width:.4;vector-effect:non-scaling-stroke;pointer-events:none}
.river{fill:none;stroke:var(--water);stroke-opacity:.55;stroke-width:.6;vector-effect:non-scaling-stroke;pointer-events:none}
.river.r1{stroke-width:1}
.rlbl{font-family:var(--display);font-style:italic;font-size:calc(8.5px*var(--inv,1));fill:var(--relief);text-anchor:middle;letter-spacing:.14em;text-transform:uppercase;opacity:.85;paint-order:stroke;stroke:var(--paper);stroke-width:2;stroke-opacity:.5;pointer-events:none}
.rlbl.zh{font-family:var(--zh);font-style:normal;text-transform:none;letter-spacing:.3em}
.rlbl.minor{display:none}
svg[data-z="2"] .rlbl.minor,svg[data-z="3"] .rlbl.minor{display:block}
.wlbl{font-family:var(--display);font-style:italic;font-size:calc(7.5px*var(--inv,1));fill:var(--water);text-anchor:middle;pointer-events:none;display:none}
svg[data-z="2"] .wlbl,svg[data-z="3"] .wlbl{display:block}
.peak path{fill:var(--relief);stroke:none;transform:scale(var(--inv,1))}
.peak text{font-family:var(--mono);font-size:calc(6.5px*var(--inv,1));fill:var(--relief);pointer-events:none;display:none}
svg[data-z="2"] .peak text,svg[data-z="3"] .peak text{display:block}
.city{cursor:pointer}
.city circle{fill:var(--panel-solid);stroke:var(--ink);stroke-width:.9;vector-effect:non-scaling-stroke;r:calc(1.6px*var(--marker,1))}
.city.cap circle{fill:var(--accent);stroke:var(--panel-solid);stroke-width:1;vector-effect:non-scaling-stroke;r:calc(2.2px*var(--marker,1))}
.city.cap .ring{fill:none;stroke:var(--accent);stroke-width:.8;opacity:.8;vector-effect:non-scaling-stroke;r:calc(4.2px*var(--marker,1))}
.city .hit{fill:var(--panel-solid);stroke:var(--ink);stroke-width:.9;vector-effect:non-scaling-stroke;r:calc(5.5px*var(--marker,1))}
.city.minor .hit{r:calc(4px*var(--marker,1))}
.city text{font-family:var(--zh);font-size:calc(9px*var(--inv,1));fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:2.6;stroke-linejoin:round;cursor:pointer}
.hit{fill:transparent;stroke:none}
.city.cap text{font-weight:700}
.city.minor{display:none}
svg[data-z="2"] .city.minor,svg[data-z="3"] .city.minor{display:block}
.lbl{font-family:var(--display);font-weight:600;font-size:calc(12px*var(--inv,1));fill:var(--ink);text-anchor:middle;letter-spacing:.18em;text-transform:uppercase;paint-order:stroke;stroke:var(--paper);stroke-width:2.4;stroke-opacity:.7;pointer-events:none}
.lbl.zh{font-family:var(--zh);text-transform:none;letter-spacing:.35em;font-size:calc(11px*var(--inv,1))}
.ev{cursor:pointer}
.ev circle{fill:var(--c);stroke:var(--panel-solid);stroke-width:1.2;vector-effect:non-scaling-stroke;r:calc(2.4px*var(--marker,1))}
.ev .hit{r:calc(7px*var(--marker,1))}
.ev .halo{fill:var(--c);opacity:.22;stroke:none;r:calc(6px*var(--marker,1))}
.ev text{font-family:var(--zh);font-size:calc(8.5px*var(--inv,1));fill:var(--c);paint-order:stroke;stroke:var(--paper);stroke-width:2.4;cursor:pointer}
.ev.on .halo{opacity:.45;r:calc(8px*var(--marker,1))}
.jr path{fill:none;stroke:var(--accent);stroke-width:1.3;vector-effect:non-scaling-stroke}
/* theme focus mode */
body.focus .pol:not(.keep){fill-opacity:.08!important;stroke-opacity:.2!important}
body.focus .lbl:not(.keep){opacity:.25}
body.focus .city.minor,body.focus .per,body.focus .ev,body.focus #g-rlbl{display:none}
body.focus .city text{opacity:.6}
#tl .span{position:absolute;top:8px;height:30px;background:var(--accent);opacity:.18;pointer-events:none;border-radius:3px}
#tl .tstop{position:absolute;top:2px;width:6px;height:6px;border-radius:50%;background:var(--accent);transform:translateX(-3px);pointer-events:none}
#tl .tstop.on{width:10px;height:10px;transform:translate(-5px,-2px);box-shadow:0 0 0 2px var(--panel-solid)}
body.focus #eras div{opacity:.35}
#themecard{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:14px;width:min(360px,70vw);background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--accent);box-shadow:var(--shadow);padding:10px 14px 12px;z-index:2;font-family:var(--zh);font-size:13px}
#themecard .t{font-family:var(--mono);font-size:10.5px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
#themecard h3{margin:2px 0 2px;font-size:17px;font-family:var(--display);font-weight:700}
#themecard .sub{font-style:italic;color:var(--ink-soft);font-size:12.5px;margin-bottom:6px}
#themecard .sum{line-height:1.55;max-height:7.8em;overflow:auto}
#themecard .nav{display:flex;gap:6px;align-items:center;margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
#themecard .nav button{min-height:26px;padding:2px 9px;font-size:11px}
#themecard .nav .x{margin-left:auto}
#themecard .src{font-family:var(--mono);font-size:10px;color:var(--ink-soft);margin-top:6px;line-height:1.4}
.ce.stop{grid-template-columns:28px 1fr}
.ce.stop .y{font-size:12px;font-weight:500}
.ce.stop .n{font-family:var(--mono);font-size:10px;color:var(--ink-soft);display:block}
.jr circle{fill:var(--paper);stroke:var(--accent);stroke-width:1.2;r:calc(5px*var(--inv,1))}
.jr g.on circle{fill:var(--accent)} .jr g.on text{fill:#fff}
.jr circle.pulse{fill:none;stroke:var(--accent);stroke-width:1;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{r:6;opacity:.8}to{r:16;opacity:0}}
.jr path.draw{stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 2.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.jr circle{fill:var(--paper);stroke:var(--accent);stroke-width:1.2}
.jr text{font-family:var(--mono);font-size:calc(8px*var(--inv,1));fill:var(--accent);text-anchor:middle;dominant-baseline:central;pointer-events:none}
/* phase card */
#phase{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:14px;width:min(340px,70vw);background:var(--panel);border:1px solid var(--rule);box-shadow:var(--shadow);padding:10px 14px 12px;z-index:2;font-family:var(--zh);font-size:13px}
#phase .t{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.04em}
#phase .dots{display:flex;gap:3px;margin:6px 0 8px;flex-wrap:wrap}
#phase .dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);opacity:.55;cursor:pointer}
#phase .dots i.on{background:var(--accent);opacity:1;transform:scale(1.25)}
#phase .sum{line-height:1.5;margin-bottom:8px}
#phase .lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px}
#phase .lg span{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
#phase .lg i{width:11px;height:11px;border-radius:2px;border:1px solid var(--ink);flex:none}
#phase .lg span.more{color:var(--ink-soft);font-family:var(--mono);font-size:11px}
#phase .tg{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
#phase .tg button{min-height:24px;padding:2px 8px;font-size:11px}
#phase .civsel{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--ink-soft);width:100%}
#phase .civsel select{flex:1;min-height:24px;padding:2px 6px;font-size:11.5px;font-family:var(--zh)}
/* detail card */
#card{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:14px;width:min(330px,70vw);background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--accent);box-shadow:var(--shadow);padding:10px 14px 12px;font-size:14px;line-height:1.5;z-index:2;font-family:var(--zh)}
#card h3{margin:0 0 4px;font-size:19px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
#card .x{position:absolute;right:10px;top:8px;cursor:pointer;color:var(--ink-soft);font-family:var(--mono);font-size:13px;padding:2px 4px}
#card h3{padding-right:22px}
#card .names{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);white-space:pre-line;line-height:1.65;margin-top:4px}
#card .ex{color:var(--ink-soft);font-style:italic;font-size:12.5px;margin-top:6px}
#card .tag{display:inline-block;font-family:var(--mono);font-size:10.5px;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:0 6px;margin-right:4px}
#card a{color:var(--accent)}
#card .k{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}
/* people */
.per{cursor:pointer}
.per rect{fill:var(--panel-solid);stroke:var(--c);stroke-width:1.2;rx:1;transform:scale(var(--inv,1))}
.per .in{fill:var(--c);stroke:none;transform:scale(var(--inv,1))}
.per text{font-family:var(--zh);font-size:calc(8.5px*var(--inv,1));fill:var(--ink);font-style:italic;paint-order:stroke;stroke:var(--paper);stroke-width:2.4;cursor:pointer}
.per.on rect{stroke-width:2.2}
.tr path{fill:none;stroke:var(--c);stroke-width:1.1;stroke-dasharray:3 2;vector-effect:non-scaling-stroke;opacity:.9}
.tr circle{fill:var(--panel-solid);stroke:var(--c);stroke-width:1.1}
.tr text{font-family:var(--zh);font-size:calc(7.5px*var(--inv,1));fill:var(--c);paint-order:stroke;stroke:var(--paper);stroke-width:2;pointer-events:none}
#card .tagline{font-family:var(--display);font-style:italic;color:var(--accent);font-size:13.5px;margin:-2px 0 6px}
#card .desc{font-size:13.5px;line-height:1.6;margin-top:6px}
#card .wk{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
#card .wk a{display:inline-block;font-family:var(--mono);font-size:11px;border:1px solid var(--accent);border-radius:3px;padding:2px 8px;text-decoration:none}
#card .wk a:hover{background:var(--accent);color:#fff}
#card .life{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
#card button.sm{min-height:24px;padding:2px 8px;font-size:11px;margin-top:8px}
#zoomc{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:14px;display:flex;flex-direction:column;gap:4px;z-index:2}
#zoomc button{width:32px;padding:0}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);background:var(--panel);border:1px solid var(--rule);padding:2px 10px;border-radius:3px;z-index:1;white-space:nowrap;max-width:60%;overflow:hidden;text-overflow:ellipsis}
/* chronicle */
#side{grid-area:side;min-height:0;border-left:1px solid var(--rule);background:var(--paper);display:flex;flex-direction:column}
#side h4{margin:0;padding:8px 8px 8px 14px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;gap:8px}
.side-meta{display:flex;align-items:center;gap:4px}
#side-x{display:none;align-items:center;justify-content:center;width:36px;min-height:36px;padding:0;border:0;background:transparent;font-size:14px}
#chron{overflow:auto;flex:1;padding:8px 10px 8px 12px;scroll-behavior:smooth}
.ce{display:grid;grid-template-columns:60px 1fr;gap:8px;padding:8px 10px;margin-bottom:6px;background:var(--panel-solid);border:1px solid transparent;border-left:3px solid var(--c);border-radius:3px;cursor:pointer;font-family:var(--zh);font-size:13px;line-height:1.45}
.ce .y{font-family:var(--mono);font-size:11px;color:var(--c);padding-top:2px}
.ce:hover{border-color:var(--rule)}
.ce.now{border-color:var(--accent);background:var(--panel)}

function showSug(){const box=$('sug');if(!sugItems.length){box.hidden=true;return}box.innerHTML=sugItems.map((s,i)=>`<div class="${i===sugOn?'on':''}" data-i="${i}">${esc(s.label)}<small>${s.t} · ${esc(s.sub)}</small></div>`).join('');box.hidden=false}
function pick(s){$('sug').hidden=true;$('q').value='';if(s.t==='city'){const n=s.g.names[0];if(INDEX[idx].year<n.from)jumpYear(n.from);flyTo(s.g.coord[0],s.g.coord[1],4);setTimeout(()=>cityCard(s.g),300)}
  else if(s.t==='person'){jumpYear(s.pp.span[0]+1);flyTo(s.pp.c[0],s.pp.c[1],4);setTimeout(()=>personCard(s.pp),300)}
  else if(s.t==='event'){jumpYear(s.ev.y);flyTo(s.ev.c[0],s.ev.c[1],4);setTimeout(()=>evCard(s.ev),300)}
  else{hover=s.p.en;applyHover();const el=document.querySelector(`.pol[data-n="${CSS.escape(s.p.en)}"]`);if(el){const bb=el.getBBox();const z=Math.min(5,Math.max(1.3,0.6*Math.min(W/bb.width,H/bb.height)));const ll=proj.invert([bb.x+bb.width/2,bb.y+bb.height/2]);if(ll)flyTo(ll[0],ll[1],z)}}}
$('q').addEventListener('input',e=>{sugItems=search(e.target.value);sugOn=-1;showSug()});
$('q').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){sugOn=Math.min(sugItems.length-1,sugOn+1);showSug()}else if(e.key==='ArrowUp'){sugOn=Math.max(0,sugOn-1);showSug()}else if(e.key==='Enter'){if(sugItems[sugOn>=0?sugOn:0])pick(sugItems[sugOn>=0?sugOn:0])}else if(e.key==='Escape'){$('sug').hidden=true}});
$('sug').addEventListener('mousedown',e=>{const d=e.target.closest('[data-i]');if(d){e.preventDefault();pick(sugItems[+d.dataset.i])}});
$('q').addEventListener('blur',()=>setTimeout(()=>$('sug').hidden=true,150));
/* events */
let chipT=0,chipK=null;$('kinds').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k,now=Date.now();
  if(chipK===k&&now-chipT<350){kinds=new Set(kinds.size===1&&kinds.has(k)?Object.keys(KINDS):[k])}else{kinds.has(k)?kinds.delete(k):kinds.add(k)}chipT=now;chipK=k;renderChrome();render()});
$('phase').addEventListener('click',e=>{const d=e.target.closest('.dots i');if(d){idx=+d.dataset.i;render();return}const s=e.target.closest('[data-n]');if(s){hover=hover===s.dataset.n?null:s.dataset.n;applyHover()}});
$('chron').addEventListener('click',e=>{const st=e.target.closest('[data-s]');if(st){gotoStop(+st.dataset.s);if(window.innerWidth<=900)closeSide();return}const d=e.target.closest('[data-e]');if(!d)return;const ev=EVENTS[+d.dataset.e];jumpYear(ev.y);flyTo(ev.c[0],ev.c[1],4);setTimeout(()=>evCard(ev),300);if(window.innerWidth<=900)closeSide()});
function handleTap(target){const e={target};
  const c=e.target.closest('.city');if(c){cityCard(GAZ.find(x=>x.en===c.dataset.g));return}
  const pr=e.target.closest('.per');if(pr){personCard(PEOPLE.find(x=>x.en===pr.dataset.p));return}
  const ev=e.target.closest('.ev');if(ev){evCard(EVENTS[+ev.dataset.e]);return}
  const s=e.target.closest('[data-stop]');if(s){gotoStop(+s.dataset.stop);return}
  const p=e.target.closest('.pol');if(p){hover=p.dataset.n||null;applyHover();card(`<h3><b>${esc(p.querySelector('title').textContent)}</b></h3>${p.dataset.n?`<div><span class="tag">${esc(p.dataset.n)}</span></div>`:''}<div class="ex">${fy(INDEX[idx].year)} · ${esc(eraOf(INDEX[idx].year).n[lang])}</div>`)}}
/* pan / pinch / wheel */
const ptrs=new Map();let pinch=null,drag=null;
let tap=null;
svg.addEventListener('pointerdown',e=>{tap={t:e.target,x:e.clientX,y:e.clientY,n:ptrs.size+1};svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);if(ptrs.size===1){drag=[e.clientX,e.clientY,cx,cy];svg.classList.add('drag')}else if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:cz,mx:(a[0]+b[0])/2,my:(a[1]+b[1])/2,cx,cy};drag=null}});
svg.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);const k=W/svg.clientWidth;
  if(pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);const nz=Math.min(12,Math.max(1,pinch.z*d/pinch.d));const r=svg.getBoundingClientRect(),mx=(pinch.mx-r.left)*k,my=(pinch.my-r.top)*k;cx=mx-(mx-pinch.cx)*nz/pinch.z;cy=my-(my-pinch.cy)*nz/pinch.z;cz=nz;applyCam();return}
  if(drag){cx=drag[2]+(e.clientX-drag[0])*k;cy=drag[3]+(e.clientY-drag[1])*k;applyCam()}});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size){drag=null;svg.classList.remove('drag');if(tap&&tap.n===1&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)<5&&e.type==='pointerup')handleTap(tap.t);tap=null}};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
function zoomAt(mx,my,f){const nz=Math.min(12,Math.max(1,cz*f));cx=mx-(mx-cx)*nz/cz;cy=my-(my-cy)*nz/cz;cz=nz;if(cz===1){cx=0;cy=0}applyCam()}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect(),k=W/r.width;zoomAt((e.clientX-r.left)*k,(e.clientY-r.top)*k,e.deltaY<0?1.15:1/1.15)},{passive:false});
$('z-in').onclick=()=>zoomAt(W/2,H/2,1.4);$('z-out').onclick=()=>zoomAt(W/2,H/2,1/1.4);$('z-0').onclick=home;
const fitPortrait=()=>{const st=$('stage');svg.setAttribute('preserveAspectRatio',st.clientHeight>st.clientWidth*0.8?'xMidYMid slice':'xMidYMid meet')};
const headEl=document.querySelector('header');
const syncChrome=()=>document.documentElement.style.setProperty('--chrome-h',headEl.offsetHeight+'px');
new ResizeObserver(syncChrome).observe(headEl);
function closeMenu(){headEl.classList.remove('open');$('b-menu').setAttribute('aria-expanded','false')}
function closeSide(){$('side').classList.remove('open');$('scrim').hidden=true;$('b-side').setAttribute('aria-expanded','false')}
function revealChron(el){const box=$('chron');if(!el||!box)return;const er=el.getBoundingClientRect(),br=box.getBoundingClientRect();box.scrollTop+=er.top-br.top-Math.max(8,(br.height-er.height)/2)}
function syncSearch(){if(!$('q'))return;$('q').placeholder=window.matchMedia('(max-width:759px)').matches?(SEARCH_S[lang]||'Search'):T[lang].search}
function onResize(){fitPortrait();syncChrome();syncSearch();if(window.innerWidth>900)closeSide()}
window.addEventListener('resize',onResize);onResize();
/* timeline */
function nearestSlice(y){let j=0,best=1e9;INDEX.forEach((s,i)=>{const d=Math.abs(s.year-y);if(d<best){best=d;j=i}});return j}
function jumpYear(y){let j=0;for(let i=0;i<INDEX.length;i++)if(INDEX[i].year<=y)j=i;idx=j;render()}
const tlPick=e=>{const r=$('tl').getBoundingClientRect();const y=Y0+(e.clientX-r.left)/r.width*(Y1-Y0);const j=nearestSlice(y);if(j!==idx){idx=j;render()}};
let tlDrag=false;$('tl').addEventListener('pointerdown',e=>{tlDrag=true;$('tl').setPointerCapture(e.pointerId);tlPick(e)});$('tl').addEventListener('pointermove',e=>{if(tlDrag)tlPick(e)});$('tl').addEventListener('pointerup',()=>tlDrag=false);
$('yrin').addEventListener('change',e=>{const v=parseInt(String(e.target.value).replace(/[^\d-]/g,''),10);if(!isNaN(v))jumpYear(Math.max(Y0,Math.min(Y1,v)))});
$('b-prev').onclick=()=>{idx=Math.max(0,idx-1);render()};$('b-next').onclick=()=>{idx=Math.min(INDEX.length-1,idx+1);render()};
$('thlist').addEventListener('click',e=>{const d=e.target.closest('[data-t]');if(!d)return;if(THEME&&THEME.id===d.dataset.t)exitTheme();else enterTheme(d.dataset.t)});
$('b-themes').onclick=e=>{e.stopPropagation();$('thmenu').hidden=!$('thmenu').hidden};document.addEventListener('click',e=>{if(!e.target.closest('#themes'))$('thmenu').hidden=true;if(!e.target.closest('header'))closeMenu()});
$('lang').onchange=e=>{lang=e.target.value;document.documentElement.lang=lang==='zh'?'zh-CN':lang;renderChrome();drawStatic();render();if(THEME)stopCard(THEME.stops[tIdx])};
$('b-tour').onclick=()=>{closeMenu();runTour()};$('b-pop').onclick=()=>{showPop=!showPop;$('b-pop').setAttribute('aria-pressed',showPop);drawSeries()};$('b-gdp').onclick=()=>{showGdp=!showGdp;$('b-gdp').setAttribute('aria-pressed',showGdp);drawSeries()};$('b-people').onclick=()=>{people=!people;$('b-people').setAttribute('aria-pressed',people);render()};
$('b-menu').onclick=e=>{e.stopPropagation();const open=headEl.classList.toggle('open');$('b-menu').setAttribute('aria-expanded',String(open));if(open)$('thmenu').hidden=true};
$('b-side').onclick=()=>{const open=!$('side').classList.contains('open');if(open){closeMenu();$('side').classList.add('open');$('scrim').hidden=window.innerWidth>900}else closeSide();$('b-side').setAttribute('aria-expanded',String(open))};
$('side-x').onclick=closeSide;$('scrim').onclick=closeSide;
$('phase-tog').onclick=()=>{const open=$('phase').classList.toggle('open');$('phase-tog').setAttribute('aria-expanded',String(open))};
$('b-play').onclick=()=>{
  if(tour){tour.paused?resumeTour():pauseTour();return}
  playing=!playing;
  if(playing)timer=setInterval(()=>{idx=idx>=INDEX.length-1?0:idx+1;render()},1600);
  else if(timer){clearInterval(timer);timer=null}
  syncPlayback();
};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(e.key==='ArrowLeft'){THEME?gotoStop(tIdx-1):$('b-prev').click()}if(e.key==='ArrowRight'){THEME?gotoStop(tIdx+1):$('b-next').click()}if(e.key===' '){e.preventDefault();$('b-play').click()}if(e.key==='Escape'){if(headEl.classList.contains('open')){closeMenu();return}if(window.innerWidth<=900&&$('side').classList.contains('open')){closeSide();return}if(THEME&&$('card').hidden)exitTheme();else $('card').hidden=true}});
/* boot */
(async()=>{
  const[ix,phys,ev,gz,pe,sr,ti]=await Promise.all(['index','physical','events','cities','people','series','themes/index'].map(n=>fetch(`data/${n}.json`).then(r=>r.json())));THEMES=ti;
  INDEX=ix.sort((a,b)=>a.year-b.year);PHYS=phys;EVENTS=ev;GAZ=gz;PEOPLE=pe;SERIES=sr;['land','lakes','ranges','deserts'].forEach(k=>PHYS[k].forEach(f=>rewind(f.geometry)));
  const q=new URLSearchParams(location.search);const L=q.get('lang');if(LANGS.includes(L))lang=L;
  document.documentElement.lang=lang==='zh'?'zh-CN':lang;
  renderChrome();drawStatic();buildRelief();
  if(CIVS.some(c=>c.id===q.get('civ')))civ=q.get('civ');const th=q.get('theme')||(q.get('journey')==='alexander'?'alexander':null);if(th&&THEMES.some(x=>x.id===th)){await enterTheme(th,+(q.get('stop')||0))}else jumpYear(q.has('year')?+q.get('year'):-323);if(q.get('tour')==='1')setTimeout(runTour,800)})();
</script>
