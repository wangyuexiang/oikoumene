<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Oikoumene: an interactive historical atlas of the Old World, 500 BCE to 2000 CE.">
<title>Oikoumene</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Serif+SC:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
/* Layout: header rail · map (left, flex) + chronicle column (right, 330px) · bottom timeline with era bands. Phase card floats bottom-left over the map; detail card floats top-right over the map. */
:root{
  --paper:#eee6d2; --paper-deep:#d8caa6; --sea:#cfdcd6; --sea-line:#a9bdb4; --water:#5f8fa8; --ink:#2a241f; --ink-soft:#6b5f52; --relief:#6f5a3a;
  --rule:#b3a487; --accent:#9a3a22; --panel:rgba(246,241,229,.95); --panel-solid:#f6f1e5; --shadow:0 2px 14px rgba(40,30,10,.16);
  --k-pol:#9a3a22; --k-sci:#1f5f8b; --k-tec:#b8720f; --k-tho:#5b3d8a; --k-rel:#2f7a4f; --k-art:#b5457a;
  --display:"Cormorant Garamond","Noto Serif SC",Georgia,serif; --zh:"Noto Serif SC","Cormorant Garamond",serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --relief-blend:multiply; --relief-op:.85;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#2e2925; --paper-deep:#1f1b18; --sea:#161e21; --sea-line:#2b383c; --water:#4f8cab; --ink:#eadfc8; --ink-soft:#b3a58d; --relief:#c9b48a; --rule:#5a5043; --accent:#e07a5f; --panel:rgba(30,27,24,.95); --panel-solid:#1e1b18; --shadow:0 2px 14px rgba(0,0,0,.5);
  --k-pol:#e07a5f; --k-sci:#6fb3e0; --k-tec:#e6a94a; --k-tho:#b48ee6; --k-rel:#6fcf97; --k-art:#e88ab8; --relief-blend:soft-light; --relief-op:.9; color-scheme:dark } }
:root[data-theme="dark"]{ --paper:#2e2925; --paper-deep:#1f1b18; --sea:#161e21; --sea-line:#2b383c; --water:#4f8cab; --ink:#eadfc8; --ink-soft:#b3a58d; --relief:#c9b48a; --rule:#5a5043; --accent:#e07a5f; --panel:rgba(30,27,24,.95); --panel-solid:#1e1b18; --shadow:0 2px 14px rgba(0,0,0,.5);
  --k-pol:#e07a5f; --k-sci:#6fb3e0; --k-tec:#e6a94a; --k-tho:#b48ee6; --k-rel:#6fcf97; --k-art:#e88ab8; --relief-blend:soft-light; --relief-op:.9; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sea);color:var(--ink);font-family:var(--display);font-size:15px;overflow:hidden}
#app{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr 330px;grid-template-areas:"hd hd" "map side" "tl tl"}
header{grid-area:hd;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--rule);background:var(--panel-solid);z-index:3}
header h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.03em;white-space:nowrap;color:var(--accent)}
header h1 small{font-family:var(--zh);font-size:13px;font-weight:500;color:var(--ink-soft);margin-left:10px;letter-spacing:0}
.ctl{display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--ink-soft);flex-wrap:wrap}
.sp{flex:1}
button,select,input{font:inherit;font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--panel-solid);border:1px solid var(--rule);border-radius:4px;padding:4px 10px;min-height:30px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#lang{padding-right:22px}
.chip{display:inline-flex;align-items:center;gap:6px;border-color:var(--c);color:var(--c);background:transparent}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 2px var(--panel-solid),0 0 0 3px var(--c)}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.chip[aria-pressed="true"] i{background:#fff;box-shadow:none}
.chip[aria-pressed="false"]{opacity:.55;border-style:dashed;text-decoration:line-through;text-decoration-thickness:1px}
.chip[aria-pressed="false"] i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
#search{position:relative}
.sep{width:1px;height:20px;background:var(--rule);margin:0 4px}
#themes{position:relative}
#b-themes::after{content:' ▾';font-size:10px}
#thmenu{position:absolute;right:0;top:34px;width:300px;background:var(--panel-solid);border:1px solid var(--rule);box-shadow:var(--shadow);z-index:9;padding:6px}
.th{display:block;padding:8px 10px;border-radius:3px;cursor:pointer;font-family:var(--zh);font-size:13px;color:var(--ink);text-decoration:none}
.th b{display:block;font-weight:600}
.th small{display:block;color:var(--ink-soft);font-family:var(--mono);font-size:10.5px;margin-top:2px}
.th:hover{background:var(--paper-deep)}
.th[aria-pressed="true"]{background:var(--accent);color:#fff}
.th[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.th.more{border-top:1px solid var(--rule);margin-top:4px;color:var(--accent);font-family:var(--mono);font-size:11.5px}
#q{width:230px;padding-left:28px;background:var(--panel-solid) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='7' cy='7' r='4.5' fill='none' stroke='%237a6a55' stroke-width='1.4'/><path d='M10.5 10.5 14 14' stroke='%237a6a55' stroke-width='1.6' stroke-linecap='round'/></svg>") 8px center/14px no-repeat}
#sug{position:absolute;left:0;top:34px;width:320px;max-height:300px;overflow:auto;background:var(--panel-solid);border:1px solid var(--rule);box-shadow:var(--shadow);z-index:9;font-family:var(--zh);font-size:13px}
#sug div{padding:6px 10px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
#sug div:hover,#sug div.on{background:var(--paper-deep)}
#sug small{font-family:var(--mono);color:var(--ink-soft);font-size:10.5px;margin-left:auto}
#stage{grid-area:map;min-height:0;min-width:0;position:relative;background:var(--sea)}
svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
svg.drag{cursor:grabbing}
.land{fill:var(--paper);stroke:none}
.coast{fill:none;stroke:var(--sea-line);stroke-width:.7;vector-effect:non-scaling-stroke}
#relief{mix-blend-mode:var(--relief-blend);opacity:var(--relief-op);pointer-events:none}
.grat{fill:none;stroke:var(--ink);stroke-opacity:.08;stroke-width:.5;vector-effect:non-scaling-stroke}
.frame{fill:none;stroke:var(--ink);stroke-opacity:.3;stroke-width:.8;vector-effect:non-scaling-stroke}
.pol{stroke-width:1.1;stroke-opacity:.85;stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:fill-opacity .25s,stroke-opacity .25s}
.pol.dim{fill-opacity:.06;stroke-opacity:.25}
.pol.un{fill:var(--paper-deep);fill-opacity:.3;stroke:var(--ink);stroke-opacity:.3;stroke-dasharray:2 2;stroke-width:.6}
.layer{transition:opacity .7s ease}
.layer.in{opacity:0}
.ghost{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:3 2.2;opacity:.6;vector-effect:non-scaling-stroke;pointer-events:none}
.lake{fill:var(--sea);stroke:var(--sea-line);stroke-width:.4;vector-effect:non-scaling-stroke;pointer-events:none}
.river{fill:none;stroke:var(--water);stroke-opacity:.55;stroke-width:.6;vector-effect:non-scaling-stroke;pointer-events:none}
.river.r1{stroke-width:1}
.rlbl{font-family:var(--display);font-style:italic;font-size:calc(8.5px*var(--inv,1));fill:var(--relief);text-anchor:middle;letter-spacing:.14em;text-transform:uppercase;opacity:.85;paint-order:stroke;stroke:var(--paper);stroke-width:2;stroke-opacity:.5;pointer-events:none}
.rlbl.zh{font-family:var(--zh);font-style:normal;text-transform:none;letter-spacing:.3em}
.rlbl.minor{display:none}
svg[data-z="2"] .rlbl.minor,svg[data-z="3"] .rlbl.minor{display:block}
.wlbl{font-family:var(--display);font-style:italic;font-size:calc(7.5px*var(--inv,1));fill:var(--water);text-anchor:middle;pointer-events:none;display:none}
svg[data-z="2"] .wlbl,svg[data-z="3"] .wlbl{display:block}
.peak path{fill:var(--relief);stroke:none}
.peak text{font-family:var(--mono);font-size:calc(6.5px*var(--inv,1));fill:var(--relief);pointer-events:none;display:none}
svg[data-z="2"] .peak text,svg[data-z="3"] .peak text{display:block}
.city{cursor:pointer}
.city circle{fill:var(--panel-solid);stroke:var(--ink);stroke-width:.9}
.city.cap circle{fill:var(--accent);stroke:var(--panel-solid);stroke-width:1}
.city.cap .ring{fill:none;stroke:var(--accent);stroke-width:.7;opacity:.8}
.city text{font-family:var(--zh);font-size:calc(9px*var(--inv,1));fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:2.6;stroke-linejoin:round;cursor:pointer}
.hit{fill:transparent;stroke:none}
.city.cap text{font-weight:700}
.city.minor{display:none}
svg[data-z="2"] .city.minor,svg[data-z="3"] .city.minor{display:block}
.lbl{font-family:var(--display);font-weight:600;font-size:calc(12px*var(--inv,1));fill:var(--ink);text-anchor:middle;letter-spacing:.18em;text-transform:uppercase;paint-order:stroke;stroke:var(--paper);stroke-width:2.4;stroke-opacity:.7;pointer-events:none}
.lbl.zh{font-family:var(--zh);text-transform:none;letter-spacing:.35em;font-size:calc(11px*var(--inv,1))}
.ev{cursor:pointer}
.ev circle{fill:var(--c);stroke:var(--panel-solid);stroke-width:1.2}
.ev .halo{fill:var(--c);opacity:.22;stroke:none}
.ev text{font-family:var(--zh);font-size:calc(8.5px*var(--inv,1));fill:var(--c);paint-order:stroke;stroke:var(--paper);stroke-width:2.4;cursor:pointer}
.ev.on .halo{opacity:.45;r:9}
.jr path{fill:none;stroke:var(--accent);stroke-width:1.3;vector-effect:non-scaling-stroke}
.jr path.draw{stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 2.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.jr circle{fill:var(--paper);stroke:var(--accent);stroke-width:1.2}
.jr text{font-family:var(--mono);font-size:calc(8px*var(--inv,1));fill:var(--accent);text-anchor:middle;dominant-baseline:central;pointer-events:none}
/* phase card */
#phase{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:14px;width:min(340px,70vw);background:var(--panel);border:1px solid var(--rule);box-shadow:var(--shadow);padding:10px 14px 12px;z-index:2;font-family:var(--zh);font-size:13px}
#phase .t{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.04em}
#phase .dots{display:flex;gap:3px;margin:6px 0 8px;flex-wrap:wrap}
#phase .dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);opacity:.55;cursor:pointer}
#phase .dots i.on{background:var(--accent);opacity:1;transform:scale(1.25)}
#phase .sum{line-height:1.5;margin-bottom:8px}
#phase .lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px}
#phase .lg span{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
#phase .lg i{width:11px;height:11px;border-radius:2px;border:1px solid var(--ink);flex:none}
#phase .lg span.more{color:var(--ink-soft);font-family:var(--mono);font-size:11px}
#phase .tg{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
#phase .tg button{min-height:24px;padding:2px 8px;font-size:11px}
/* detail card */
#card{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:14px;width:min(330px,70vw);background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--accent);box-shadow:var(--shadow);padding:10px 14px 12px;font-size:14px;line-height:1.5;z-index:2;font-family:var(--zh)}
#card h3{margin:0 0 4px;font-size:19px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
#card .x{position:absolute;right:10px;top:8px;cursor:pointer;color:var(--ink-soft);font-family:var(--mono);font-size:13px;padding:2px 4px}
#card h3{padding-right:22px}
#card .names{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);white-space:pre-line;line-height:1.65;margin-top:4px}
#card .ex{color:var(--ink-soft);font-style:italic;font-size:12.5px;margin-top:6px}
#card .tag{display:inline-block;font-family:var(--mono);font-size:10.5px;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:0 6px;margin-right:4px}
#card a{color:var(--accent)}
#card .k{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}
/* people */
.per{cursor:pointer}
.per rect{fill:var(--panel-solid);stroke:var(--c);stroke-width:1.2;rx:1}
.per .in{fill:var(--c);stroke:none}
.per text{font-family:var(--zh);font-size:calc(8.5px*var(--inv,1));fill:var(--ink);font-style:italic;paint-order:stroke;stroke:var(--paper);stroke-width:2.4;cursor:pointer}
.per.on rect{stroke-width:2.2}
.tr path{fill:none;stroke:var(--c);stroke-width:1.1;stroke-dasharray:3 2;vector-effect:non-scaling-stroke;opacity:.9}
.tr circle{fill:var(--panel-solid);stroke:var(--c);stroke-width:1.1}
.tr text{font-family:var(--zh);font-size:calc(7.5px*var(--inv,1));fill:var(--c);paint-order:stroke;stroke:var(--paper);stroke-width:2;pointer-events:none}
#card .tagline{font-family:var(--display);font-style:italic;color:var(--accent);font-size:13.5px;margin:-2px 0 6px}
#card .desc{font-size:13.5px;line-height:1.6;margin-top:6px}
#card .wk{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
#card .wk a{display:inline-block;font-family:var(--mono);font-size:11px;border:1px solid var(--accent);border-radius:3px;padding:2px 8px;text-decoration:none}
#card .wk a:hover{background:var(--accent);color:#fff}
#card .life{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
#card button.sm{min-height:24px;padding:2px 8px;font-size:11px;margin-top:8px}
#zoomc{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:14px;display:flex;flex-direction:column;gap:4px;z-index:2}
#zoomc button{width:32px;padding:0}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);background:var(--panel);border:1px solid var(--rule);padding:2px 10px;border-radius:3px;z-index:1;white-space:nowrap;max-width:60%;overflow:hidden;text-overflow:ellipsis}
/* chronicle */
#side{grid-area:side;min-height:0;border-left:1px solid var(--rule);background:var(--paper);display:flex;flex-direction:column}
#side h4{margin:0;padding:8px 14px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--rule);display:flex;justify-content:space-between}
#chron{overflow:auto;flex:1;padding:8px 10px 8px 12px;scroll-behavior:smooth}
.ce{display:grid;grid-template-columns:60px 1fr;gap:8px;padding:8px 10px;margin-bottom:6px;background:var(--panel-solid);border:1px solid transparent;border-left:3px solid var(--c);border-radius:3px;cursor:pointer;font-family:var(--zh);font-size:13px;line-height:1.45}
.ce .y{font-family:var(--mono);font-size:11px;color:var(--c);padding-top:2px}
.ce:hover{border-color:var(--rule)}
.ce.now{border-color:var(--accent);background:var(--panel)}
.ce.era{grid-template-columns:1fr;background:transparent;border:0;border-top:1px solid var(--rule);margin-top:10px;padding:8px 2px 2px;font-family:var(--display);font-style:italic;color:var(--ink-soft);font-size:13px;letter-spacing:.06em;cursor:default}
/* timeline */
footer{grid-area:tl;border-top:1px solid var(--rule);background:var(--panel-solid);display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:center;padding-block:8px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:3}
#tl{position:relative;height:64px;cursor:pointer;user-select:none}
#eras{position:absolute;left:0;right:0;top:10px;height:26px;display:flex;border-radius:3px;overflow:hidden;border:1px solid var(--rule)}
#eras div{height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--zh);font-size:11px;color:var(--ink);overflow:hidden;white-space:nowrap;border-right:1px solid rgba(0,0,0,.12);background:var(--c);opacity:.8}
#slices{position:absolute;left:0;right:0;top:38px;height:6px}
#series{position:absolute;left:0;right:0;top:0;height:64px;pointer-events:none;overflow:visible;z-index:1}
#series path{fill:none;stroke-width:1.8;vector-effect:non-scaling-stroke;paint-order:stroke}
#series path.pop,#series path.gdp{filter:drop-shadow(0 0 1.5px var(--panel-solid))}
#series .pop{stroke:var(--k-rel)} #series .gdp{stroke:var(--k-tec)}
#series .fill{fill:var(--k-rel);fill-opacity:.10;stroke:none} #series .fill.g{fill:var(--k-tec)}
#series text{font-family:var(--mono);font-size:9px;fill:var(--ink);paint-order:stroke;stroke:var(--panel-solid);stroke-width:2.5px}
#stoggles{display:flex;gap:6px;align-items:center}
#stoggles button{min-height:22px;padding:1px 7px;font-size:10.5px}
#stoggles button[aria-pressed="true"].pop{background:var(--k-rel);border-color:var(--k-rel);color:#fff}
#stoggles button[aria-pressed="true"].gdp{background:var(--k-tec);border-color:var(--k-tec);color:#fff}
#note{margin-top:2px}
#slices i{position:absolute;top:0;width:2px;height:6px;background:var(--ink);opacity:.35}
#evt{position:absolute;left:0;right:0;top:0;height:9px;pointer-events:none}
#evt i{position:absolute;top:0;width:2px;height:7px;background:var(--c);opacity:.85}
#cur{position:absolute;z-index:2;top:4px;width:2px;height:44px;background:var(--accent);transform:translateX(-1px);pointer-events:none}
#cur b{position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%);background:var(--ink);color:var(--paper);font-family:var(--mono);font-weight:400;font-size:10.5px;padding:1px 7px;border-radius:3px;white-space:nowrap}
#ticks{position:absolute;left:0;right:0;bottom:0;font-family:var(--mono);font-size:9.5px;color:var(--ink-soft)}
#ticks span{position:absolute;transform:translateX(-50%)}
#yrbox{display:flex;align-items:center;gap:4px}
#yrin{width:84px;text-align:center;font-size:14px;font-family:var(--display);font-weight:700}
#yr{font-size:26px;font-weight:700;min-width:6ch;font-variant-numeric:tabular-nums;line-height:1;font-family:var(--display)}
#yr small{display:block;font-family:var(--mono);font-size:10px;font-weight:400;color:var(--ink-soft);margin-top:3px}
#note{grid-column:1/-1;font-size:10.5px;color:var(--ink-soft);font-family:var(--mono);line-height:1.4;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#b-side{display:none}
@media (max-width:900px){
  #app{grid-template-columns:1fr;grid-template-areas:"hd" "map" "tl"}
  #side{position:absolute;right:0;top:0;bottom:0;width:min(330px,85vw);z-index:4;box-shadow:var(--shadow);transform:translateX(100%);transition:transform .3s}
  #side.open{transform:none} #b-side{display:inline-block}
}
@media (max-width:640px){
  header h1{font-size:18px} header h1 small{display:block;margin:0;font-size:11px} #q{width:150px} #hint{display:none}
  #card{top:auto;bottom:0;right:0;left:0;width:auto;max-height:42%;overflow:auto;border-left:0;border-right:0;border-bottom:0;border-radius:10px 10px 0 0}
  #phase{display:none} #zoomc{bottom:auto;top:12px}
  footer{grid-template-columns:1fr;gap:6px} #yr{display:none} #note{display:none} #yrbox{justify-content:center}
  header{gap:6px 10px} button,select,input{padding:3px 8px;min-height:28px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){.layer,.pol,#side{transition:none}.jr path.draw{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>Oikoumene <small id="sub"></small></h1>
  <div id="search"><input id="q" type="search" autocomplete="off" placeholder=""><div id="sug" hidden></div></div>
  <div class="ctl" id="kinds"></div>

async function buildRelief(){try{
  const img=new Image();img.src='data/relief.webp';await img.decode();
  const sw=img.naturalWidth,sh=img.naturalHeight;const sc=document.createElement('canvas');sc.width=sw;sc.height=sh;const sx=sc.getContext('2d');sx.drawImage(img,0,0);const src=sx.getImageData(0,0,sw,sh).data;
  const K=2,ow=W*K,oh=H*K,G=6;const gw=Math.floor(ow/G)+2,gh=Math.floor(oh/G)+2;const gx=new Float32Array(gw*gh),gy=new Float32Array(gw*gh);
  for(let j=0;j<gh;j++)for(let i=0;i<gw;i++){const ll=proj.invert([i*G/K,j*G/K]);let u=NaN,v=NaN;if(ll&&inB(ll[0],ll[1])){u=(ll[0]-B.west)/(B.east-B.west)*(sw-1);v=(B.north-ll[1])/(B.north-B.south)*(sh-1)}gx[j*gw+i]=u;gy[j*gw+i]=v}
  const oc=document.createElement('canvas');oc.width=ow;oc.height=oh;const ox=oc.getContext('2d');const out=ox.createImageData(ow,oh);const d=out.data;
  for(let y=0;y<oh;y++){const j=Math.floor(y/G),fy=y/G-j;for(let x=0;x<ow;x++){const i=Math.floor(x/G),fx=x/G-i;const a=j*gw+i;const u00=gx[a],u10=gx[a+1],u01=gx[a+gw],u11=gx[a+gw+1];if(isNaN(u00)||isNaN(u10)||isNaN(u01)||isNaN(u11))continue;
    const u=(u00*(1-fx)+u10*fx)*(1-fy)+(u01*(1-fx)+u11*fx)*fy,v=(gy[a]*(1-fx)+gy[a+1]*fx)*(1-fy)+(gy[a+gw]*(1-fx)+gy[a+gw+1]*fx)*fy;const s=(Math.round(v)*sw+Math.round(u))*4;const o=(y*ow+x)*4;d[o]=d[o+1]=d[o+2]=src[s];d[o+3]=255}}
  ox.putImageData(out,0,0);$('relief').setAttribute('href',oc.toDataURL('image/webp',.8));
}catch(e){console.warn('relief skipped',e)}}

  const s=e.target.closest('[data-stop]');if(s){const st=JOURNEY.stops[+s.dataset.stop];jumpYear(st.y);card(`<h3><b>${+s.dataset.stop+1}. ${esc(lang==='zh'?st.zh:st.en)} · ${fy(st.y)}</b></h3><div>${esc(lang==='zh'?st.nz:st.ne)}</div><div class="ex">${esc(lang==='zh'?JOURNEY.zh:JOURNEY.en)}</div>${wiki(JOURNEY.w,JOURNEY.wz)}`);return}
  const p=e.target.closest('.pol');if(p){hover=p.dataset.n||null;applyHover();card(`<h3><b>${esc(p.querySelector('title').textContent)}</b></h3>${p.dataset.n?`<div><span class="tag">${esc(p.dataset.n)}</span></div>`:''}<div class="ex">${fy(INDEX[idx].year)} · ${esc(eraOf(INDEX[idx].year).n[lang])}</div>`)}}
/* pan / pinch / wheel */
const ptrs=new Map();let pinch=null,drag=null;
let tap=null;
svg.addEventListener('pointerdown',e=>{tap={t:e.target,x:e.clientX,y:e.clientY,n:ptrs.size+1};svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);if(ptrs.size===1){drag=[e.clientX,e.clientY,cx,cy];svg.classList.add('drag')}else if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:cz,mx:(a[0]+b[0])/2,my:(a[1]+b[1])/2,cx,cy};drag=null}});
svg.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);const k=W/svg.clientWidth;
  if(pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);const nz=Math.min(12,Math.max(1,pinch.z*d/pinch.d));const r=svg.getBoundingClientRect(),mx=(pinch.mx-r.left)*k,my=(pinch.my-r.top)*k;cx=mx-(mx-pinch.cx)*nz/pinch.z;cy=my-(my-pinch.cy)*nz/pinch.z;cz=nz;applyCam();return}
  if(drag){cx=drag[2]+(e.clientX-drag[0])*k;cy=drag[3]+(e.clientY-drag[1])*k;applyCam()}});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size){drag=null;svg.classList.remove('drag');if(tap&&tap.n===1&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)<5&&e.type==='pointerup')handleTap(tap.t);tap=null}};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
function zoomAt(mx,my,f){const nz=Math.min(12,Math.max(1,cz*f));cx=mx-(mx-cx)*nz/cz;cy=my-(my-cy)*nz/cz;cz=nz;if(cz===1){cx=0;cy=0}applyCam()}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect(),k=W/r.width;zoomAt((e.clientX-r.left)*k,(e.clientY-r.top)*k,e.deltaY<0?1.15:1/1.15)},{passive:false});
$('z-in').onclick=()=>zoomAt(W/2,H/2,1.4);$('z-out').onclick=()=>zoomAt(W/2,H/2,1/1.4);$('z-0').onclick=home;
const fitPortrait=()=>{const st=$('stage');svg.setAttribute('preserveAspectRatio',st.clientHeight>st.clientWidth*0.8?'xMidYMid slice':'xMidYMid meet')};
window.addEventListener('resize',fitPortrait);fitPortrait();
/* timeline */
function nearestSlice(y){let j=0,best=1e9;INDEX.forEach((s,i)=>{const d=Math.abs(s.year-y);if(d<best){best=d;j=i}});return j}
function jumpYear(y){let j=0;for(let i=0;i<INDEX.length;i++)if(INDEX[i].year<=y)j=i;idx=j;render()}
const tlPick=e=>{const r=$('tl').getBoundingClientRect();const y=Y0+(e.clientX-r.left)/r.width*(Y1-Y0);const j=nearestSlice(y);if(j!==idx){idx=j;render()}};
let tlDrag=false;$('tl').addEventListener('pointerdown',e=>{tlDrag=true;$('tl').setPointerCapture(e.pointerId);tlPick(e)});$('tl').addEventListener('pointermove',e=>{if(tlDrag)tlPick(e)});$('tl').addEventListener('pointerup',()=>tlDrag=false);
$('yrin').addEventListener('change',e=>{const v=parseInt(String(e.target.value).replace(/[^\d-]/g,''),10);if(!isNaN(v))jumpYear(Math.max(Y0,Math.min(Y1,v)))});
$('b-prev').onclick=()=>{idx=Math.max(0,idx-1);render()};$('b-next').onclick=()=>{idx=Math.min(INDEX.length-1,idx+1);render()};
$('b-jr').onclick=()=>{jr=!jr;$('g-jr').innerHTML='';$('thmenu').hidden=true;if(jr)jumpYear(-334);else render()};
$('b-themes').onclick=e=>{e.stopPropagation();$('thmenu').hidden=!$('thmenu').hidden};document.addEventListener('click',e=>{if(!e.target.closest('#themes'))$('thmenu').hidden=true});
$('lang').onchange=e=>{lang=e.target.value;document.documentElement.lang=lang==='zh'?'zh-CN':lang;renderChrome();drawStatic();render()};
$('b-tour').onclick=runTour;$('b-pop').onclick=()=>{showPop=!showPop;$('b-pop').setAttribute('aria-pressed',showPop);drawSeries()};$('b-gdp').onclick=()=>{showGdp=!showGdp;$('b-gdp').setAttribute('aria-pressed',showGdp);drawSeries()};$('b-people').onclick=()=>{people=!people;$('b-people').setAttribute('aria-pressed',people);render()};$('b-side').onclick=()=>$('side').classList.toggle('open');
let timer=null;$('b-play').onclick=()=>{playing=!playing;$('b-play').textContent=playing?'❚❚':'▶';$('b-play').setAttribute('aria-pressed',playing);if(playing)timer=setInterval(()=>{idx=idx>=INDEX.length-1?0:idx+1;render()},1600);else clearInterval(timer)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(e.key==='ArrowLeft')$('b-prev').click();if(e.key==='ArrowRight')$('b-next').click();if(e.key===' '){e.preventDefault();$('b-play').click()}if(e.key==='Escape')$('card').hidden=true});
/* boot */
(async()=>{
  const[ix,phys,ev,gz,pe,sr]=await Promise.all(['index','physical','events','cities','people','series'].map(n=>fetch(`data/${n}.json`).then(r=>r.json())));
  INDEX=ix.sort((a,b)=>a.year-b.year);PHYS=phys;EVENTS=ev;GAZ=gz;PEOPLE=pe;SERIES=sr;['land','lakes','ranges','deserts'].forEach(k=>PHYS[k].forEach(f=>rewind(f.geometry)));
  const q=new URLSearchParams(location.search);const L=q.get('lang');if(LANGS.includes(L))lang=L;
  document.documentElement.lang=lang==='zh'?'zh-CN':lang;if(q.get('journey')==='alexander')jr=true;
  renderChrome();drawStatic();buildRelief();
  jumpYear(q.has('year')?+q.get('year'):-323);if(q.get('tour')==='1')setTimeout(runTour,800)})();
</script>
